<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0e5d46">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="The page you were looking for could not be found. Use the links below to continue to the Treasureland Elementary School homepage, admissions or contact pages.">
    <link rel="icon" type="image/png" href="assets/images/brand/TES-Logo-nobg.png">
    <link rel="stylesheet" href="assets/css/site-chrome.css">
    <script src="assets/js/site-config.js"></script>
    <script>
        document.documentElement.dataset.tesSeason = window.TES_SITE_CONFIG
            ? window.TES_SITE_CONFIG.seasonForDate()
            : 'normal';
    </script>
    <title>Page Not Found | Treasureland Elementary School</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", sans-serif;
            color: #16221e;
            background: #fbf8f2;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
        }

        main {
            width: min(100%, 38rem);
            padding: clamp(2rem, 7vw, 4rem);
            border: 1px solid #e6dfd1;
            border-radius: 1.5rem;
            background: #fff;
            text-align: center;
            box-shadow: 0 18px 50px rgba(16, 36, 29, 0.08);
        }

        .brand {
            width: min(11rem, 60%);
            height: auto;
            margin-bottom: 1.5rem;
        }

        .code {
            margin: 0;
            color: #1b4d3a;
            font-size: clamp(3rem, 12vw, 5rem);
            font-weight: 800;
            line-height: 1;
        }

        h1 {
            margin: 1rem 0;
            font-family: Georgia, serif;
            font-size: clamp(1.75rem, 6vw, 2.5rem);
            font-weight: 500;
        }

        p { color: #52635b; }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.75rem;
        }

        a {
            display: inline-flex;
            min-height: 2.75rem;
            align-items: center;
            justify-content: center;
            padding: 0.7rem 1.15rem;
            border: 1px solid #1b4d3a;
            border-radius: 999px;
            color: #1b4d3a;
            font-weight: 700;
            text-decoration: none;
        }

        a.primary {
            border-color: #b98a2f;
            background: #b98a2f;
            color: #10241d;
        }

        a:focus-visible {
            outline: 3px solid #b98a2f;
            outline-offset: 3px;
        }

        /* Seasonal treatment, matching the rest of the site. The snowfall
           markup is always present and only shown while the theme is on. */
        .tes-festive-decor {
            display: none;
        }

        html[data-tes-season="festive"] .tes-festive-decor {
            display: block;
        }

        .season-greeting {
            display: none;
            margin: 1.25rem 0 0;
            color: #176341;
            font-weight: 700;
        }

        html[data-tes-season="festive"] .season-greeting {
            display: block;
        }

        html[data-tes-season="festive"] main {
            border-color: rgba(217, 195, 143, 0.9);
        }

        html[data-tes-season="festive"] .code {
            color: #a52c3b;
        }
    </style>
</head>
<body>
    <main>
        <a href="index.html" aria-label="Treasureland Elementary School home">
            <picture><source srcset="assets/images/brand/TES-Logo-nobg.webp" type="image/webp"><img width="475" height="346" class="brand" src="assets/images/brand/TES-Logo-nobg.png" alt="Treasureland Elementary School" loading="lazy" decoding="async"></picture>
        </a>
        <p class="code" aria-hidden="true">404</p>
        <h1>We couldn't find that page</h1>
        <p>The address may have changed, or the page may no longer be available.</p>
        <p class="season-greeting"><span aria-hidden="true">❄</span> Season’s greetings from Treasureland — wishing every family joy, peace and a bright new year.</p>
        <nav class="actions" aria-label="Suggested pages">
            <a class="primary" href="index.html">Go to homepage</a>
            <a href="admissions.html">Admissions</a>
        </nav>
    </main>
    <div class="tes-festive-decor" aria-hidden="true">
        <span class="tes-festive-snowflake tes-festive-snowflake--one">❄</span>
        <span class="tes-festive-snowflake tes-festive-snowflake--two">❄</span>
        <span class="tes-festive-snowflake tes-festive-snowflake--three">❄</span>
        <span class="tes-festive-snowflake tes-festive-snowflake--four">❄</span>
    </div>
</body>
</html>
