<!DOCTYPE html>
<html lang="en">
<head>

    <title>Page Not Found | Treasureland Elementary School</title>

        :root {
            color-scheme: light;
            font-family: Inter, "Segoe UI", sans-serif;
            color: #16221e;

        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 1.5rem;
        }

        main {
            width: min(100%, 38rem);
            padding: clamp(2rem, 7vw, 4rem);
            border: 1px solid #e6dfd1;
            border-radius: 1.5rem;
            background: #fff;
            text-align: center;
            box-shadow: 0 18px 50px rgba(16, 36, 29, 0.08);
        }

        .brand {
            width: min(11rem, 60%);
            height: auto;
            margin-bottom: 1.5rem;
        }

        .code {
            margin: 0;
            color: #1b4d3a;
            font-size: clamp(3rem, 12vw, 5rem);
            font-weight: 800;
            line-height: 1;
        }

        h1 {
            margin: 1rem 0;
            font-family: Georgia, serif;
            font-size: clamp(1.75rem, 6vw, 2.5rem);
            font-weight: 500;
        }

        p { color: #52635b; }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.75rem;
        }

        a {
            display: inline-flex;
            min-height: 2.75rem;
            align-items: center;
            justify-content: center;
            padding: 0.7rem 1.15rem;
            border: 1px solid #1b4d3a;
            border-radius: 999px;
            color: #1b4d3a;
            font-weight: 700;
            text-decoration: none;
        }

        a.primary {
            border-color: #b98a2f;
            background: #b98a2f;
            color: #10241d;
        }

        a:focus-visible {
            outline: 3px solid #b98a2f;
            outline-offset: 3px;
        }

</head>
<body>
    <main>
        <a href="index.html" aria-label="Treasureland Elementary School home">
            <img class="brand" src="assets/images/brand/TES-Logo-nobg.png" alt="Treasureland Elementary School">
        </a>
        <p class="code" aria-hidden="true">404</p>

        <nav class="actions" aria-label="Suggested pages">
